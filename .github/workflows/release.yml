name: Release

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write

jobs:
  build-app:
    name: Build app (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Windows is deliberately NOT in this matrix. `npm run dist` on
    # GitHub-hosted Windows runners reproducibly hangs inside
    # electron-builder's packaging step, always at the identical point
    # (right after downloading its bundled NSIS tool), regardless of the
    # runner OS image (Server 2025 vs. 2022), the Windows target (`nsis`
    # vs. `portable`), or Windows Defender configuration (three different
    # exclusion setups tried, including one that turned out to target the
    # wrong temp directory and one that correctly targeted the right one)
    # — eight separate CI cycles ruled all of that out with direct
    # evidence, including isolated diagnostics proving every individual
    # component (electron-builder's native helper binary, its bundled 7z
    # tool, even the exact Node.js call electron-builder itself makes)
    # completes in under a second on its own. See DEV_NOTES.md for the
    # full investigation. The Windows portable exe is built locally
    # instead (reliable — proven repeatedly this session) and uploaded to
    # the release manually; see README.md's release process.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os_name: macos
            arch: x64
          - runner: macos-14
            os_name: macos
            arch: arm64
          - runner: ubuntu-latest
            os_name: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set build variables (from tag)
        shell: bash
        run: |
          GIT_TAG="${GITHUB_REF_NAME}"
          GIT_VER="${GIT_TAG#release/}"
          if [[ $GIT_VER =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9]+$ ]]; then
            GH_TYPE='Release Candidate'
          else
            GH_TYPE='Release'
          fi
          echo "GIT_VER=$GIT_VER" >> $GITHUB_ENV
          echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
          echo "GH_TYPE=$GH_TYPE" >> $GITHUB_ENV
          echo "OS_NAME=${{ matrix.os_name }}" >> $GITHUB_ENV
          echo "ARCH_NAME=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend install

      # electron-builder reads productName/version straight out of
      # package.json for artifact naming. npm pkg set (not `npm version`,
      # which refuses to run unless the git working directory is clean —
      # something `npm install` above could easily violate via lockfile
      # drift) just edits the field directly, which is all this needs.
      - name: Set package version from tag
        shell: bash
        run: npm pkg set version="${{ env.GIT_VER }}"

      # Without this, the packaged app has no GITHUB_CLIENT_ID and every
      # end user hits "Couldn't start GitHub sign-in" on first launch —
      # see electron/main.ts's own comment for how this file gets loaded
      # at runtime (before the userData cwd redirect) and package.json's
      # extraResources for how it gets bundled. The repo secret is named
      # GH_APP_CLIENT_ID rather than GITHUB_APP_CLIENT_ID/GITHUB_CLIENT_ID
      # because GitHub Actions rejects any secret name starting with the
      # GITHUB_ prefix (reserved for its own auto-provided values) — add
      # it at Settings → Secrets and variables → Actions → New repository
      # secret, value = the ethos-manual-editor GitHub App's client id
      # (https://github.com/settings/apps/ethos-manual-editor). Not a
      # true secret (it's a public device-flow client id, safe to embed
      # in a downloadable executable — see config/github.ts's own
      # comment), so nothing here needs the extra care a real credential
      # would.
      - name: Write backend/.env
        shell: bash
        run: echo "GITHUB_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}" > backend/.env

      # Builds natively for whatever OS/arch this runner already is — no
      # explicit --win/--mac/--linux or --x64/--arm64 flags needed, since
      # each matrix entry's host already matches the target (matching how
      # the old PyInstaller job built natively per runner too). No
      # code-signing certificates are configured, so Windows/macOS
      # binaries come out unsigned (SmartScreen/Gatekeeper will warn on
      # first launch) — acceptable for now, revisit once/if signing certs
      # are available.
      - name: Build + package (electron-builder)
        shell: bash
        run: npm run dist

      - name: List build output
        shell: bash
        run: ls -la release

      - name: Upload app artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: release/*.dmg
          if-no-files-found: error

      - name: Upload app artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-app]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set build variables (from tag)
        shell: bash
        run: |
          GIT_TAG="${GITHUB_REF_NAME}"
          GIT_VER="${GIT_TAG#release/}"
          if [[ $GIT_VER =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9]+$ ]]; then
            GH_TYPE='Release Candidate'
          else
            GH_TYPE='Release'
          fi
          echo "GIT_VER=$GIT_VER" >> $GITHUB_ENV
          echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
          echo "GH_TYPE=$GH_TYPE" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./dist

      - name: Create release notes
        run: |
          python3 .github/scripts/extract-release-notes.py "${{ env.GIT_VER }}" Releases.md > Notes.md
          sed -n '1,200p' Notes.md

      # Windows isn't built here (see build-app job's own comment) — this
      # creates the release with the mac/Linux assets only. The Windows
      # portable exe is built locally and added afterward with:
      #   gh release upload <tag> "Ethos Manual Editor <version>-x64.exe"
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd dist
          gh release create "${{ env.GIT_TAG }}" --notes-file ../Notes.md -t "Ethos Manual Editor - ${{ env.GH_TYPE }} ${{ env.GIT_VER }}" *
