name: Release

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write

jobs:
  build-app:
    name: Build app (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Caught live: a Windows leg once sat on the electron-builder step for
    # 1h24m (all 4 other platforms finished in minutes) with no error —
    # a stuck/wedged hosted-runner VM or a hung binary download, not a
    # bug in this config (the identical command succeeded locally in
    # ~8 minutes). No single step has its own timeout, so a repeat
    # would otherwise silently burn hours instead of failing fast.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_name: windows
            arch: x64
          - runner: macos-15-intel
            os_name: macos
            arch: x64
          - runner: macos-14
            os_name: macos
            arch: arm64
          - runner: ubuntu-latest
            os_name: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set build variables (from tag)
        shell: bash
        run: |
          GIT_TAG="${GITHUB_REF_NAME}"
          GIT_VER="${GIT_TAG#release/}"
          if [[ $GIT_VER =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9]+$ ]]; then
            GH_TYPE='Release Candidate'
          else
            GH_TYPE='Release'
          fi
          echo "GIT_VER=$GIT_VER" >> $GITHUB_ENV
          echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
          echo "GH_TYPE=$GH_TYPE" >> $GITHUB_ENV
          echo "OS_NAME=${{ matrix.os_name }}" >> $GITHUB_ENV
          echo "ARCH_NAME=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend install

      # electron-builder reads productName/version straight out of
      # package.json for artifact naming. npm pkg set (not `npm version`,
      # which refuses to run unless the git working directory is clean —
      # something `npm install` above could easily violate via lockfile
      # drift) just edits the field directly, which is all this needs.
      - name: Set package version from tag
        shell: bash
        run: npm pkg set version="${{ env.GIT_VER }}"

      # The Windows leg's repeated hangs (see job comment above) were
      # traced to dead stops right around electron-builder downloading/
      # extracting/signing freshly-created executables — the signature of
      # Windows Defender's real-time scanner interfering with those
      # files. `Set-MpPreference -DisableRealtimeMonitoring` looked like
      # a fix (ran with no error) but had zero real effect and the hang
      # recurred anyway: GitHub's hosted Windows runners have Defender
      # Tamper Protection on, which silently no-ops that toggle — their
      # own runner-images docs say Defender can't be disabled, only
      # excluded from. Exclusions ARE honored, so exclude the paths
      # electron-builder actually writes/downloads into instead.
      - name: Exclude build paths from Windows Defender scanning
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder\Cache"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Temp"
          Add-MpPreference -ExclusionProcess "electron-builder.exe"
          Add-MpPreference -ExclusionProcess "makensis.exe"
          Add-MpPreference -ExclusionProcess "signtool.exe"

      # Builds natively for whatever OS/arch this runner already is — no
      # explicit --win/--mac/--linux or --x64/--arm64 flags needed, since
      # each matrix entry's host already matches the target (matching how
      # the old PyInstaller job built natively per runner too). No
      # code-signing certificates are configured, so Windows/macOS
      # binaries come out unsigned (SmartScreen/Gatekeeper will warn on
      # first launch) — acceptable for now, revisit once/if signing certs
      # are available.
      - name: Build + package (electron-builder)
        shell: bash
        run: npm run dist

      - name: List build output
        shell: bash
        run: ls -la release

      - name: Upload app artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: release/*.exe
          if-no-files-found: error

      - name: Upload app artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: release/*.dmg
          if-no-files-found: error

      - name: Upload app artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-app]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set build variables (from tag)
        shell: bash
        run: |
          GIT_TAG="${GITHUB_REF_NAME}"
          GIT_VER="${GIT_TAG#release/}"
          if [[ $GIT_VER =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9]+$ ]]; then
            GH_TYPE='Release Candidate'
          else
            GH_TYPE='Release'
          fi
          echo "GIT_VER=$GIT_VER" >> $GITHUB_ENV
          echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
          echo "GH_TYPE=$GH_TYPE" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./dist

      - name: Create release notes
        run: |
          python3 .github/scripts/extract-release-notes.py "${{ env.GIT_VER }}" Releases.md > Notes.md
          sed -n '1,200p' Notes.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd dist
          gh release create "${{ env.GIT_TAG }}" --notes-file ../Notes.md -t "Ethos Manual Editor - ${{ env.GH_TYPE }} ${{ env.GIT_VER }}" *
