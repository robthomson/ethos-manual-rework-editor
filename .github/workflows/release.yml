name: Release

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write

jobs:
  build-app:
    name: Build app (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Windows was excluded from this matrix for a long stretch — `npm run
    # dist` on GitHub-hosted Windows runners reproducibly hung inside
    # electron-builder's packaging step. Nine investigation cycles (see
    # DEV_NOTES.md's full "Windows CI hang" writeup) eventually found it
    # via a live interactive tmate session: it was never a deadlock —
    # electron-builder's packaging step was genuinely, slowly compressing
    # backend/node_modules, 95% of whose ~2000 files were devDependency
    # tooling (typescript, ts-node-dev and its own substantial transitive
    # tree) never needed at runtime, at maximum LZMA compression on a
    # shared runner's storage. scripts/prepare-backend-prod-modules.js
    # (a real `npm ci --omit=dev` into a separate backend/node_modules.prod/)
    # cut that file count by over half and took the whole packaging step
    # from 40+ minutes (still running when a timed unattended test was
    # cancelled) / historically as long as 1h24m, down to about 90
    # seconds — verified directly on a real Windows CI runner before
    # re-adding it here.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os_name: macos
            arch: x64
          - runner: macos-14
            os_name: macos
            arch: arm64
          - runner: ubuntu-latest
            os_name: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
          - runner: windows-2022
            os_name: win
            arch: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set build variables (from tag)
        shell: bash
        run: |
          GIT_TAG="${GITHUB_REF_NAME}"
          GIT_VER="${GIT_TAG#release/}"
          if [[ $GIT_VER =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9]+$ ]]; then
            GH_TYPE='Release Candidate'
          else
            GH_TYPE='Release'
          fi
          echo "GIT_VER=$GIT_VER" >> $GITHUB_ENV
          echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
          echo "GH_TYPE=$GH_TYPE" >> $GITHUB_ENV
          echo "OS_NAME=${{ matrix.os_name }}" >> $GITHUB_ENV
          echo "ARCH_NAME=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # npm ci (not npm install) — faster (no dependency resolution,
      # just installs exactly what's locked) and never rewrites the
      # lockfile, which matters for the npm pkg set step right below.
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      # electron-builder reads productName/version straight out of
      # package.json for artifact naming. npm pkg set (not `npm version`,
      # which refuses to run unless the git working directory is clean)
      # just edits the field directly, which is all this needs.
      - name: Set package version from tag
        shell: bash
        run: npm pkg set version="${{ env.GIT_VER }}"

      # Without this, the packaged app has no GITHUB_CLIENT_ID and every
      # end user hits "Couldn't start GitHub sign-in" on first launch —
      # see electron/main.ts's own comment for how this file gets loaded
      # at runtime (before the userData cwd redirect) and package.json's
      # extraResources for how it gets bundled. The repo secret is named
      # GH_APP_CLIENT_ID rather than GITHUB_APP_CLIENT_ID/GITHUB_CLIENT_ID
      # because GitHub Actions rejects any secret name starting with the
      # GITHUB_ prefix (reserved for its own auto-provided values) — add
      # it at Settings → Secrets and variables → Actions → New repository
      # secret, value = the ethos-manual-editor GitHub App's client id
      # (https://github.com/settings/apps/ethos-manual-editor). Not a
      # true secret (it's a public device-flow client id, safe to embed
      # in a downloadable executable — see config/github.ts's own
      # comment), so nothing here needs the extra care a real credential
      # would.
      - name: Write backend/.env
        shell: bash
        run: echo "GITHUB_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}" > backend/.env

      # Builds natively for whatever OS/arch this runner already is — no
      # explicit --win/--mac/--linux or --x64/--arm64 flags needed, since
      # each matrix entry's host already matches the target (matching how
      # the old PyInstaller job built natively per runner too). No
      # code-signing certificates are configured, so Windows/macOS
      # binaries come out unsigned (SmartScreen/Gatekeeper will warn on
      # first launch) — acceptable for now, revisit once/if signing certs
      # are available.
      - name: Build + package (electron-builder)
        shell: bash
        run: npm run dist

      - name: List build output
        shell: bash
        run: ls -la release

      - name: Upload app artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: release/*.dmg
          if-no-files-found: error

      - name: Upload app artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

      - name: Upload app artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: release/*.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-app]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set build variables (from tag)
        shell: bash
        run: |
          GIT_TAG="${GITHUB_REF_NAME}"
          GIT_VER="${GIT_TAG#release/}"
          if [[ $GIT_VER =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9]+$ ]]; then
            GH_TYPE='Release Candidate'
          else
            GH_TYPE='Release'
          fi
          echo "GIT_VER=$GIT_VER" >> $GITHUB_ENV
          echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
          echo "GH_TYPE=$GH_TYPE" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./dist

      - name: Create release notes
        run: |
          python3 .github/scripts/extract-release-notes.py "${{ env.GIT_VER }}" Releases.md > Notes.md
          sed -n '1,200p' Notes.md

      # Windows is built by build-app now too (see that job's own
      # comment for the fix that made this possible) — its artifact
      # downloads into ./dist alongside mac/Linux via the same
      # download-artifact step above, so the glob below already picks it
      # up. No separate manual upload step needed anymore.
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd dist
          gh release create "${{ env.GIT_TAG }}" --notes-file ../Notes.md -t "Ethos Manual Editor - ${{ env.GH_TYPE }} ${{ env.GIT_VER }}" *
