name: Debug Windows Hang

# Manual-only, throwaway diagnostic for the Windows electron-builder hang
# (see release.yml's own comment history for the full investigation).
# Isolates whether app-builder.exe (electron-builder's bundled native
# helper binary, spawned as a child process to do its actual downloads)
# hangs on its very first execution on a fresh CI machine — a fast,
# cheap way to test that without waiting through a full ~25-minute
# `npm run dist` cycle each time. Delete this file once the real hang is
# understood and fixed.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe app-builder.exe on a fresh Windows runner
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Locate app-builder.exe
        shell: bash
        run: find node_modules/app-builder-bin -iname "*.exe"

      - name: Probe app-builder.exe --help (own short timeout)
        shell: powershell
        timeout-minutes: 2
        run: |
          $exe = "node_modules\app-builder-bin\win\x64\app-builder.exe"
          Write-Host "Running: $exe --help"
          & $exe --help
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Probe standalone 7za.exe (control — no app-builder involved)
        shell: powershell
        timeout-minutes: 2
        run: |
          $sza = "node_modules\7zip-bin\win\x64\7za.exe"
          Write-Host "Running: $sza"
          & $sza
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Probe app-builder.exe download-artifact WITH absolute SZA_PATH (matches real electron-builder invocation)
        shell: powershell
        timeout-minutes: 5
        run: |
          $sza = (Resolve-Path "node_modules\7zip-bin\win\x64\7za.exe").Path
          $env:SZA_PATH = $sza
          $exe = "node_modules\app-builder-bin\win\x64\app-builder.exe"
          $url = "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z"
          Write-Host "SZA_PATH=$env:SZA_PATH"
          Write-Host "Running: $exe download-artifact --name nsis-3.0.4.1-take3 --url $url"
          & $exe download-artifact --name nsis-3.0.4.1-take3 --url $url
          Write-Host "Exit code: $LASTEXITCODE"

      - name: Probe standalone 7za.exe real extraction (control — no app-builder involved)
        shell: powershell
        timeout-minutes: 3
        run: |
          $sza = (Resolve-Path "node_modules\7zip-bin\win\x64\7za.exe").Path
          Invoke-WebRequest -Uri "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z" -OutFile "$env:RUNNER_TEMP\nsis.7z"
          Write-Host "Downloaded to $env:RUNNER_TEMP\nsis.7z, extracting..."
          & $sza x "$env:RUNNER_TEMP\nsis.7z" "-o$env:RUNNER_TEMP\nsis-extracted" -y
          Write-Host "Exit code: $LASTEXITCODE"
          Get-ChildItem "$env:RUNNER_TEMP\nsis-extracted" | Select-Object -First 5

      # The two probes above proved the download+extraction operation
      # itself is instant when PowerShell spawns app-builder.exe directly.
      # This replicates electron-builder's OWN internal call exactly
      # (Node.js spawning app-builder.exe via builder-util's
      # executeAppBuilder(), not PowerShell) to isolate whether the
      # Node-driven spawn specifically is what hangs.
      - name: Probe Node-driven spawn of app-builder.exe (exact electron-builder code path)
        shell: bash
        timeout-minutes: 5
        run: node debug-node-spawn.js
