name: App PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-app:
    name: Build PR (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os_name: macos
            arch: x64
          - runner: macos-14
            os_name: macos
            arch: arm64
          - runner: ubuntu-latest
            os_name: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
          - runner: windows-2022
            os_name: win
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build variables (PR version)
        shell: bash
        run: |
          PR_NUMBER='${{ github.event.pull_request.number }}'
          echo "GIT_VER=PR-${PR_NUMBER}" >> $GITHUB_ENV
          echo "OS_NAME=${{ matrix.os_name }}" >> $GITHUB_ENV
          echo "ARCH_NAME=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # npm ci (not npm install) — faster (no dependency resolution,
      # just installs exactly what's locked) and never rewrites the
      # lockfile, which matters for the npm pkg set step right below.
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      # npm pkg set (not `npm version`, which refuses to run unless the
      # git working directory is clean) just edits the field directly,
      # which is all this needs.
      - name: Set package version (PR-based)
        shell: bash
        run: npm pkg set version="0.0.0-${{ env.GIT_VER }}"

      # See release.yml's own comment for why this exists and why the
      # secret is named GH_APP_CLIENT_ID rather than GITHUB_CLIENT_ID.
      # Note: a PR from a fork doesn't get repo secrets at all, so this
      # resolves to an empty GITHUB_CLIENT_ID there — the build still
      # succeeds (predist's fallback in package.json handles a missing
      # file the same way), sign-in in that artifact just won't work,
      # same as before this change.
      - name: Write backend/.env
        shell: bash
        run: echo "GITHUB_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}" > backend/.env

      # Builds natively for whatever OS/arch this runner already is — see
      # release.yml's own comment for why no --win/--mac/--linux or
      # --x64/--arm64 flags are needed.
      - name: Build + package (electron-builder)
        shell: bash
        run: npm run dist

      - name: List build output
        shell: bash
        run: ls -la release

      - name: Upload app artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: release/*.dmg
          if-no-files-found: error

      - name: Upload app artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

      - name: Upload app artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: release/*.exe
          if-no-files-found: error
