name: App Push Build

on:
  push:
    branches:
      - 'main'

jobs:
  build-app:
    name: Build Push (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # See release.yml's own comment — a Windows leg once hung on the
    # electron-builder step for 1h24m (a stuck runner/download, not this
    # config; the same command succeeded locally in ~8 minutes) with no
    # per-step timeout to catch it.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_name: windows
            arch: x64
          - runner: macos-15-intel
            os_name: macos
            arch: x64
          - runner: macos-14
            os_name: macos
            arch: arm64
          - runner: ubuntu-latest
            os_name: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build variables (commit-based version)
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "GIT_VER=commit-${SHORT_SHA}" >> $GITHUB_ENV
          echo "OS_NAME=${{ matrix.os_name }}" >> $GITHUB_ENV
          echo "ARCH_NAME=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend install

      # npm pkg set (not `npm version`, which refuses to run unless the
      # git working directory is clean — something `npm install` above
      # could easily violate via lockfile drift) just edits the field
      # directly, which is all this needs.
      - name: Set package version (commit-based)
        shell: bash
        run: npm pkg set version="0.0.0-${{ env.GIT_VER }}"

      # See release.yml's own comment: the Windows hang's signature (dead
      # stop right after a signtool pass on a fresh unsigned exe) points
      # to Windows Defender's real-time scanner, not this config. Safe to
      # disable on this ephemeral, single-use VM.
      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # Builds natively for whatever OS/arch this runner already is — see
      # release.yml's own comment for why no --win/--mac/--linux or
      # --x64/--arm64 flags are needed.
      - name: Build + package (electron-builder)
        shell: bash
        run: npm run dist

      - name: List build output
        shell: bash
        run: ls -la release

      - name: Upload app artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: release/*.exe
          if-no-files-found: error

      - name: Upload app artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: release/*.dmg
          if-no-files-found: error

      - name: Upload app artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-manual-editor-${{ env.GIT_VER }}-${{ env.OS_NAME }}-${{ env.ARCH_NAME }}
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error
